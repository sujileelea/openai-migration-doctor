name: Migration Doctor for OpenAI APIs
description: Create source-grounded OpenAI API migration reports without target writes on GitHub-hosted Linux or macOS.
author: Migration Doctor contributors

inputs:
  path:
    description: POSIX repository path to scan, absolute or relative to the GitHub workspace.
    required: false
    default: "."
  output-directory:
    description: New POSIX report directory outside the repository; relative paths resolve under runner.temp.
    required: false
    default: ""

outputs:
  exit-code:
    description: Migration Doctor exit code; 1 means blocking findings were reported.
    value: ${{ steps.report.outputs.exit-code }}
  report-directory:
    description: Directory containing the Markdown, JSON, SARIF, and HTML reports.
    value: ${{ steps.report.outputs.report-directory }}
  sarif-path:
    description: Path to the generated SARIF report.
    value: ${{ steps.report.outputs.sarif-path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20
        package-manager-cache: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.13.7"

    - name: Set up uv
      uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        version: "0.9.18"
        enable-cache: true

    - name: Create migration report
      id: report
      shell: bash
      env:
        MIGRATION_DOCTOR_ACTION_SOURCE: ${{ github.action_path }}
        INPUT_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        INPUT_PATH: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/.github/actions/run-migration-doctor.sh"

branding:
  icon: search
  color: blue
