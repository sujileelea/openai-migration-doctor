name: deterministic-core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13.7"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.1.4
        with:
          version: "0.9.18"
          enable-cache: true
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm python:lock:check
      - run: pnpm python:sync
      - run: pnpm python:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Run Phase 6 regression benchmark
        run: pnpm benchmark --output "$RUNNER_TEMP/phase6-benchmark.json"
      - name: Upload Phase 6 benchmark ledger
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phase6-benchmark
          path: ${{ runner.temp }}/phase6-benchmark.json
          if-no-files-found: ignore
