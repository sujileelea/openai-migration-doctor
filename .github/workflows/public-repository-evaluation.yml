name: Public repository evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "53 6 1 * *"

permissions:
  contents: read

concurrency:
  group: public-repository-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: Scan pinned public revisions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.9.18"
          enable-cache: true

      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm python:sync
      - run: pnpm build
      - name: Evaluate pinned public repositories (network)
        run: node scripts/evaluate-public-repositories.mjs --output "$RUNNER_TEMP/public-repositories.json"
      - name: Upload evaluation ledger
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: public-repository-evaluation
          path: ${{ runner.temp }}/public-repositories.json
          if-no-files-found: error
